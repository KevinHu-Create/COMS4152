# Runs the RSpec and Cucumber suites (with combined coverage) and checks the
# React client on every push to main and on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: RSpec + Cucumber
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILS_ENV: test
      BUNDLE_WITHOUT: production
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby (from server/.ruby-version) and install gems
        uses: ruby/setup-ruby@v1
        with:
          working-directory: server
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies (Cucumber builds the client)
        working-directory: client
        run: npm ci

      - name: RSpec
        run: bundle exec rspec --format progress --format html --out coverage/reports/rspec.html

      - name: Cucumber (headless Chrome)
        run: bundle exec cucumber --format progress --format html --out coverage/reports/cucumber.html

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/.last_run.json ]; then
            ruby -rjson -e '
              r = JSON.parse(File.read("coverage/.last_run.json"))["result"]
              puts "### Combined coverage (RSpec + Cucumber)"
              puts ""
              puts "| Lines | Branches |"
              puts "|------:|---------:|"
              puts "| #{r["line"]}% | #{r["branch"] || "-"}% |"
              puts ""
              puts "Download the **test-reports** artifact for the full coverage report and the RSpec and Cucumber HTML reports."
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: server/coverage
          include-hidden-files: true
          retention-days: 30

  frontend:
    name: Frontend type-check, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npx eslint src

      - name: Type-check and production build
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1
